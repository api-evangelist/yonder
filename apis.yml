name: Yonder
description: 'Yonder is a UK-based financial technology company offering rewards credit and debit cards
  — a "financial membership" that earns points on everyday spending, redeemable across 300+ dining, travel,
  shopping, entertainment and wellness partners. Cards run on the Mastercard network with no foreign-exchange
  fees, and Yonder is authorised and regulated by the UK Financial Conduct Authority (FCA) with FSCS-protected
  accounts held via partner banks. Yonder ships a consumer mobile app and a help centre but does not expose
  a public developer API or portal. Added to the API Evangelist network as a VC-portfolio lead (backers
  include Northzone, Seedcamp and Techstars).'
